services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crypto-screener-backend
    ports:
      - "8000:8000"
    restart: unless-stopped
    networks:
      - crypto-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: crypto-screener-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - crypto-network

networks:
  crypto-network:
    driver: bridge
